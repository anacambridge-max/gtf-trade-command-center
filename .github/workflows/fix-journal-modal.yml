name: Fix journal modal

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-modal:
    if: ${{ !contains(github.event.head_commit.message, '[journal-modal-fixed-v2]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch journal modal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # The modal CSS was overriding .hidden because .modal{display:flex}
          # appeared after .hidden{display:none}. Make the hidden state explicit.
          if '.modal.hidden{display:none!important}' not in s:
              s = s.replace('</style>', '.modal.hidden{display:none!important}</style>', 1)

          # Remove the obsolete duplicate openModal declaration if present.
          old_open = "function openModal(){if(!selected)return;const q=+$('rQty').textContent.replace(/,/g,'')||0;$('mQty').value=q;$('mExit').value=selected.target;$('modal').classList.remove('hidden')}"
          s = s.replace(old_open, '', 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No modal visibility patch needed"
          else
            git commit -m "Fix journal modal visibility [journal-modal-fixed-v2]"
            git push
          fi
